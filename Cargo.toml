[package]
name = "ratsus"
version = "0.1.0"
edition = "2021"
rust-version = "1.70"
description = "Harness-backed session TUI built with Ratkit"
license = "MIT"

[dependencies]
anyhow = "1"
arboard = "3"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
crossterm = "0.28"
portable-pty = "0.8"
ratatui = "0.29"
ratkit = { path = "../ratkit", features = ["termtui", "resizable-grid", "toast", "dialog", "file-system-tree", "hotkey-footer", "menu-bar", "markdown-preview", "code-widget", "file-watcher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
insta = "1"
